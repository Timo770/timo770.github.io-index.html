<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Website Registration</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>


<body>
<h1>Splash Zone Tickets</h1>

<div>
    <label for="name">Name:</label>
    <input type="text" id="name" placeholder="Enter your name">
</div>

<div>
    <label for="age">Age:</label>
    <input type="number" id="age" min="0" placeholder="Enter your age">
</div>

<div class="ticketButton">
    <button class="ticketButton" onclick="generateTicket()">Get Ticket</button>
</div>


<div id="result"></div>
<script src="app.js"></script>
</body>

</html>
